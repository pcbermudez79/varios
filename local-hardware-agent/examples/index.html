<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Local Hardware Agent — Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 880px; margin: 24px auto; padding: 0 16px; color:#111; }
    h1 { margin-top: 0; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; }
    button { padding: 8px 14px; margin: 4px 4px 4px 0; cursor: pointer; }
    pre { background:#0b1021; color:#d9e2ff; padding:12px; border-radius:6px; overflow:auto; max-height:280px; }
    label { display:block; margin: 8px 0 4px; font-weight:600; }
    input, select, textarea { width: 100%; padding: 6px 8px; box-sizing: border-box; font-family: inherit; }
    .row { display:flex; gap:12px; }
    .row > * { flex:1; }
    .status { font-size: 0.9em; padding: 4px 8px; border-radius: 4px; }
    .status.on  { background:#dcfce7; color:#065f46; }
    .status.off { background:#fee2e2; color:#991b1b; }
  </style>
</head>
<body>
  <h1>Local Hardware Agent — Demo</h1>
  <p>
    Estado del agente: <span id="status" class="status off">desconectado</span>
    <button id="connect">Conectar</button>
    <button id="disconnect">Desconectar</button>
  </p>

  <section>
    <h2>Conexión</h2>
    <div class="row">
      <div>
        <label>Host</label>
        <input id="host" value="127.0.0.1" />
      </div>
      <div>
        <label>Transport</label>
        <select id="transport">
          <option value="ws">WebSocket</option>
          <option value="http">HTTP</option>
        </select>
      </div>
      <div>
        <label>TLS</label>
        <select id="secure">
          <option value="false">No (ws / http)</option>
          <option value="true">Sí (wss / https)</option>
        </select>
      </div>
    </div>
    <label>Token (si el agente lo requiere)</label>
    <input id="token" placeholder="Opcional" />
  </section>

  <section>
    <h2>Red y sistema</h2>
    <button id="btnNet">getNetworkInfo()</button>
    <button id="btnPing">ping()</button>
    <pre id="netOut">—</pre>
  </section>

  <section>
    <h2>Impresoras</h2>
    <button id="btnList">getPrinters()</button>
    <label>Impresora seleccionada</label>
    <select id="printerSelect"></select>
    <pre id="printersOut">—</pre>
  </section>

  <section>
    <h2>Impresión RAW (ESC/POS / ZPL)</h2>
    <label>Contenido RAW</label>
    <textarea id="rawData" rows="6">
Hola desde Local Hardware Agent!
Ticket de prueba
--------------------------------
    </textarea>
    <button id="btnRaw">printRaw()</button>
    <button id="btnZpl">Enviar ZPL de ejemplo</button>
  </section>

  <section>
    <h2>Impresión de imagen</h2>
    <input type="file" id="imgFile" accept="image/*" />
    <label>Modo</label>
    <select id="imgMode">
      <option value="spooler">Spooler del SO (imagen normal)</option>
      <option value="escpos">Térmica ESC/POS (raster)</option>
      <option value="zpl">Zebra ZPL (^GFA)</option>
    </select>
    <button id="btnImg">printImage()</button>
  </section>

  <script src="../client-sdk/client-sdk.js"></script>
  <script>
    let client = null;
    const $ = (id) => document.getElementById(id);
    const setStatus = (ok) => {
      $('status').textContent = ok ? 'conectado' : 'desconectado';
      $('status').className = 'status ' + (ok ? 'on' : 'off');
    };
    const log = (el, obj) => { el.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2); };

    function make() {
      client = HardwareAgent.create({
        host: $('host').value,
        transport: $('transport').value,
        secure: $('secure').value === 'true',
        token: $('token').value || null
      });
      client.on('open', () => setStatus(true));
      client.on('close', () => setStatus(false));
      client.on('error', (e) => console.error('agent error', e));
      client.on('event', (e) => console.log('agent event', e));
    }

    $('connect').onclick = async () => {
      make();
      if ($('transport').value === 'ws') {
        try { await client.connect(); }
        catch (e) { alert('No se pudo conectar: ' + e.message); }
      } else {
        try { await client.ping(); setStatus(true); }
        catch (e) { alert('No responde: ' + e.message); }
      }
    };

    $('disconnect').onclick = () => { if (client) client.close(); setStatus(false); };

    $('btnPing').onclick = async () => log($('netOut'), await client.ping());
    $('btnNet').onclick  = async () => log($('netOut'), await client.getNetworkInfo());

    $('btnList').onclick = async () => {
      const list = await client.getPrinters();
      log($('printersOut'), list);
      const sel = $('printerSelect');
      sel.innerHTML = '';
      list.forEach((p) => {
        const o = document.createElement('option');
        o.value = p.name; o.textContent = `${p.name} ${p.default ? '(default)' : ''}`;
        sel.appendChild(o);
      });
    };

    $('btnRaw').onclick = async () => {
      const name = $('printerSelect').value;
      const res = await client.printRaw(name, $('rawData').value + '\n\n\n');
      alert('OK: ' + JSON.stringify(res));
    };

    $('btnZpl').onclick = async () => {
      const name = $('printerSelect').value;
      const zpl = '^XA^FO50,50^ADN,36,20^FDLocal Hardware Agent^FS^FO50,120^BY3^BCN,100,Y,N,N^FD123456789^FS^XZ';
      const res = await client.printRaw(name, zpl);
      alert('OK: ' + JSON.stringify(res));
    };

    $('btnImg').onclick = async () => {
      const file = $('imgFile').files[0];
      if (!file) return alert('Selecciona una imagen');
      const name = $('printerSelect').value;
      const res = await client.printImage(name, file, { format: $('imgMode').value });
      alert('OK: ' + JSON.stringify(res));
    };
  </script>
</body>
</html>
